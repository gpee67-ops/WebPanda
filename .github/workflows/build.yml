
name: Build WebPanda for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out WebPanda
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build WebPanda
        run: dotnet publish PandaBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Include start page
        shell: pwsh
        run: Copy-Item panda.html publish/panda.html -Force

      - name: Upload WebPanda
        uses: actions/upload-artifact@v4
        with:
          name: WebPanda-Windows-x64
          path: publish/
          if-no-files-found: error
